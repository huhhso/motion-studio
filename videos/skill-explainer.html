<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../brand.css">
<style>
  .abs { position: absolute; }

  /* ---- shared look ---- */
  .tee   { font-family: var(--font-display); font-weight: 500; white-space: nowrap; }
  .title { left: 0; top: 0; font-family: var(--font-display); font-weight: 700; line-height: 1.1;
           letter-spacing: -0.02em; transform-origin: 0 0; white-space: nowrap; }
  .title .hl { color: var(--accent); position: relative; display: inline-block; }
  .title .swoosh { position: absolute; left: 0; right: 0; bottom: -0.04em; height: 0.09em;
                   border-radius: 0.05em; background: var(--accent); transform-origin: left center; }

  .mascot { left: 0; top: 0; transform-origin: 50% 50%; mix-blend-mode: multiply; z-index: 10; } /* on top; its white box blends away */

  .card { background: var(--surface); border-radius: 28px; }
  .card .ring { position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 4px var(--accent); }
  .num  { font-family: var(--font-display); font-weight: 700; color: var(--accent); line-height: 1;
          display: inline-block; transform-origin: left bottom; }
  .head { font-family: var(--font-display); font-weight: 600; line-height: 1.15; letter-spacing: -0.01em; }
  .line { font-family: var(--font-body); line-height: 1.4; }

  /* Brand rule: the logo sits above artwork, both higher on the page and on a higher layer. */
  .logo { z-index: 20; transform-origin: 50% 50%; }
  .cta  { z-index: 20; font-family: var(--font-display); font-weight: 700; white-space: nowrap; text-align: center;
          color: var(--accent-2); line-height: 1.2; }

  /* ---- landscape 1920x1080 (YouTube) ---- */
  body.landscape .tee   { font-size: 48px; }
  body.landscape .title { font-size: 72px; }
  body.landscape .card  { width: 1000px; height: 196px; padding: 0 48px;
                          display: grid; grid-template-columns: 130px 1fr; column-gap: 32px; align-items: center; }
  body.landscape .num   { font-size: 124px; justify-self: center; transform-origin: center; }
  body.landscape .head  { font-size: 50px; }
  body.landscape .line  { font-size: 32px; margin-top: 8px; }
  body.landscape .logo  { width: 420px; }
  body.landscape .cta   { font-size: 66px; }

  /* ---- vertical 1080x1920 (Reels / Shorts / TikTok): card content stacks ---- */
  body.vertical .tee    { font-size: 52px; }
  body.vertical .title  { font-size: 84px; }
  body.vertical .card   { left: 72px; width: 936px; height: 300px; padding: 34px 48px; }
  body.vertical .num    { font-size: 96px; }
  body.vertical .head   { font-size: 54px; margin-top: 14px; }
  body.vertical .line   { font-size: 34px; margin-top: 6px; }
  body.vertical .logo   { width: 480px; }
  body.vertical .cta    { font-size: 86px; }
</style>
</head>
<body>
  <img class="abs mascot" id="mascot" src="../assets/mascot.png" alt="">

  <div class="abs tee" id="tee">Got a result you love?</div>
  <div class="abs title" id="title">Turn it into<br>a <span class="hl">skill<span class="swoosh" id="swoosh"></span></span>.</div>

  <div class="abs card" id="card1"><div class="ring"></div><div class="num">1</div>
    <div class="txt"><div class="head">Capture the moment</div>
    <div class="line">Like turning a client answer into a post.</div></div></div>
  <div class="abs card" id="card2"><div class="ring"></div><div class="num">2</div>
    <div class="txt"><div class="head">Say “make this a skill”</div>
    <div class="line">It saves your steps, style and rules.</div></div></div>
  <div class="abs card" id="card3"><div class="ring"></div><div class="num">3</div>
    <div class="txt"><div class="head">Reuse it anytime</div>
    <div class="line">Paste the next answer. Get the next post.</div></div></div>

  <img class="abs logo" id="logo" src="../assets/w-creative-logo.png" alt="W Creative">
  <div class="abs cta" id="cta">Follow me for more<br>AI shortcuts</div>

<script>
  // ---- format: landscape by default; ?variant=vertical for 1080x1920 ----
  const VERTICAL = new URLSearchParams(location.search).get("variant") === "vertical";
  window.DURATION = 15;
  window.SIZE = VERTICAL ? [1080, 1920] : [1920, 1080];
  const [W, H] = window.SIZE;
  document.body.className = VERTICAL ? "vertical" : "landscape";

  // ---- layout (px). Mascot states are [centerX, centerY, boxSize]. ----
  const L = VERTICAL ? {
    titleFont: 84, bigScale: 1.35, header: { x: 72, y: 250 },
    introCX: 540, introTitleTop: 1170, teeAloneY: 1150, teeGap: 26, teeH: 72,
    mascot: { intro: [540, 640, 780], header: [860, 360, 360], end: [540, 1046, 690] },
    cardTops: [560, 890, 1220], cardLefts: [72, 72, 72],
    logo: { cx: 540, top: 210 }, cta: { cx: 540, top: 1440 },
  } : {
    titleFont: 72, bigScale: 1.75, header: { x: 120, y: 90 },
    introCX: 570, teeGap: 26, teeH: 66,
    // Text left, mascot big on the right in every scene (same balance as the end card).
    mascot: { intro: [1406, 560, 820], header: [1500, 610, 720], end: [1406, 653, 690] },
    cardTops: [300, 518, 736], cardLefts: [120, 120, 120],
    logo: { cx: 570, top: 172 }, cta: { cx: 575, top: 660 },
  };

  const $ = id => document.getElementById(id);
  const tee = $("tee"), title = $("title"), swoosh = $("swoosh"), mascot = $("mascot");
  const logo = $("logo"), cta = $("cta");
  const cards = [1, 2, 3].map(i => $("card" + i));
  cards.forEach((c, i) => { c.style.top = L.cardTops[i] + "px"; c.style.left = L.cardLefts[i] + "px"; });
  const parts = cards.map(c => ({
    ring: c.querySelector(".ring"), num: c.querySelector(".num"),
    bits: [c.querySelector(".head"), c.querySelector(".line")],
  }));

  // ---- helpers ----
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const prog = (t, start, dur) => clamp((t - start) / dur);
  const lerp = (a, b, p) => a + (b - a) * p;
  const outCubic = x => 1 - Math.pow(1 - x, 3);
  const inOutCubic = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const outBack = x => { const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
  const lerp3 = (a, b, p) => a.map((v, i) => lerp(v, b[i], p));

  // ---- timeline (seconds) ----
  const T = { mascotIn: 0.1, teeIn: 0.35, titleIn: 1.4, swoosh: 2.1, teeOut: 3.3, mascotUp: 3.15, toHeader: 3.5,
              steps: [4.0, 6.6, 9.2], exit: 11.8, toEnd: 11.9, logoIn: 12.7, ctaIn: 13.4 };

  window.render = function (t) {
    // Measured every frame (fonts are loaded by render time); transforms don't affect offset sizes.
    const tw = title.offsetWidth, th = title.offsetHeight, teeW = tee.offsetWidth;
    const bigW = tw * L.bigScale, bigH = th * L.bigScale;

    // Intro positions for the title block (tee-up sits just above the big title).
    const introX = L.introCX - bigW / 2;
    const introY = L.introTitleTop ?? (H - (L.teeH + L.teeGap + bigH)) / 2 + L.teeH + L.teeGap;

    const ex = inOutCubic(prog(t, T.exit, 0.8));            // exit of title + cards
    const up = inOutCubic(prog(t, T.toHeader, 0.7));         // title -> header

    // ---- mascot: pops in, moves to the header, then to the end card; gentle bob throughout ----
    const mIn = prog(t, T.mascotIn, 0.9);
    const toHead = inOutCubic(prog(t, T.mascotUp, 0.7));
    const toEnd = inOutCubic(prog(t, T.toEnd, 0.9));
    let [cx, cy, size] = lerp3(lerp3(L.mascot.intro, L.mascot.header, toHead), L.mascot.end, toEnd);
    const bob = Math.sin((t / 2.4) * Math.PI * 2) * size * 0.015;
    const tilt = Math.sin((t / 3.1) * Math.PI * 2) * 1.5;
    const pop = 0.6 + 0.4 * outBack(mIn);
    mascot.style.width = mascot.style.height = size + "px";
    mascot.style.opacity = clamp(mIn * 2.5);
    mascot.style.transform =
      `translate(${cx - size / 2}px, ${cy - size / 2 + bob + (1 - outCubic(mIn)) * 60}px) rotate(${tilt}deg) scale(${pop})`;

    // ---- tee-up: rises in, slides to sit above the title, fades out ----
    const teeIn = outCubic(prog(t, T.teeIn, 0.7));
    const make = inOutCubic(prog(t, T.titleIn, 0.8));
    const teeOut = inOutCubic(prog(t, T.teeOut, 0.5));
    const teeX = L.introCX - teeW / 2;
    const teeAloneY = L.teeAloneY ?? (H - L.teeH) / 2;
    tee.style.left = teeX + "px";
    tee.style.top = lerp(teeAloneY, introY - L.teeH - L.teeGap, make) + "px";
    tee.style.opacity = teeIn * (1 - teeOut);
    tee.style.transform = `translateY(${(1 - teeIn) * 30 - teeOut * 40}px)`;

    // ---- title: rises in big, accent swoosh draws under "skill", then eases into the header ----
    const tIn = outCubic(prog(t, T.titleIn, 0.8));
    const s = lerp(L.bigScale, 1, up);
    const x = lerp(introX, L.header.x, up);
    const y = lerp(introY, L.header.y, up) + (1 - tIn) * 50 - ex * 60;
    title.style.opacity = tIn * (1 - ex);
    title.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
    swoosh.style.transform = `scaleX(${inOutCubic(prog(t, T.swoosh, 0.6))})`;

    // ---- steps: card rises in, number pops, text follows; active card gets the accent ring ----
    T.steps.forEach((st, i) => {
      const c = cards[i];
      const p = outCubic(prog(t, st, 0.7));
      const exI = inOutCubic(prog(t, T.exit + i * 0.06, 0.7));
      c.style.opacity = p * (1 - exI);
      c.style.transform = `translateY(${(1 - p) * 70 - exI * 60}px)`;

      const n = prog(t, st + 0.12, 0.7);
      parts[i].num.style.opacity = clamp(n * 3);
      parts[i].num.style.transform = `scale(${0.5 + 0.5 * outBack(n)})`;
      parts[i].bits.forEach((el, k) => {
        const q = outCubic(prog(t, st + 0.3 + k * 0.12, 0.6));
        el.style.opacity = q;
        el.style.transform = `translateY(${(1 - q) * 24}px)`;
      });

      const next = T.steps[i + 1] ?? T.exit;
      parts[i].ring.style.opacity = inOutCubic(prog(t, st + 0.3, 0.4)) * (1 - inOutCubic(prog(t, next, 0.4)));
    });

    // ---- end card: logo eases in, then the call to action ----
    logo.style.left = L.logo.cx - logo.offsetWidth / 2 + "px";
    logo.style.top = L.logo.top + "px";
    cta.style.left = L.cta.cx - cta.offsetWidth / 2 + "px";
    cta.style.top = L.cta.top + "px";
    const lg = outCubic(prog(t, T.logoIn, 0.9));
    logo.style.opacity = lg;
    logo.style.transform = `scale(${0.9 + 0.1 * lg})`;
    const ct = outCubic(prog(t, T.ctaIn, 0.7));
    cta.style.opacity = ct;
    cta.style.transform = `translateY(${(1 - ct) * 24}px)`;
  };

  // Preview in a browser: skill-explainer.html?t=5 or ?variant=vertical&t=5
  window.render(parseFloat(new URLSearchParams(location.search).get("t")) || 0);
</script>
</body>
</html>
